name: Validate and deploy GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for QA
        run: npx playwright install --with-deps chromium

      - name: Run build, HTML validation, and responsive browser tests
        run: npm run qa
        env:
          CI: true

      - name: Build repository-path preview
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_SITE_MODE: preview

      - name: Verify repository base path and preview noindex guard
        run: npm run validate:pages
        env:
          EXPECTED_BASE_PATH: /${{ github.event.repository.name }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
